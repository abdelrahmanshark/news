#flutter pub add flutter_launcher_icons
# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/launcher_icon.png"

  android: "launcher_icon"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#171717"
  adaptive_icon_foreground: "assets/branding/launcher_icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/launcher_icon_foreground.png"

  ios: true
  remove_alpha_ios: true

#flutter pub get
#dart run flutter_launcher_icons
